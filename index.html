<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Preflight"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4d148c">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png">
<title>777 Preflight</title>
<style>
/* Layout: cockpit card — sticky header with leg info + progress, two columns (briefings | paperwork) on iPad, stacked on phone */
:root {
  --bg: #f3f0f8; --panel: #ffffff; --ink: #1d1530; --muted: #6a6080; --line: #ddd6ea;
  --accent: #4d148c; --accent-ink: #ffffff; --done: #2f7d4f; --na: #8a6d1f; --na-bg: #f6edd4; --hover: #f7f4fb;
  --bar: #4d148c; --bar-ink: #ffffff; --bar-muted: #d6c6ef; --bar-field: rgba(255,255,255,.14); --bar-line: rgba(255,255,255,.32); --bar-done: #9fe5bb;
  --display: -apple-system, "SF Pro Display", system-ui, sans-serif;
  --body: -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110b1a; --panel: #1a1326; --ink: #e6dff1; --muted: #9d92b2; --line: #2d2440;
    --accent: #a57ce0; --accent-ink: #110b1a; --done: #5cc58a; --na: #d8b65a; --na-bg: #2e2716; --hover: #221a31;
    --bar: #2a1650; --bar-ink: #ece5f8; --bar-muted: #b4a2d6; --bar-field: rgba(255,255,255,.08); --bar-line: rgba(255,255,255,.18); --bar-done: #5cc58a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #110b1a; --panel: #1a1326; --ink: #e6dff1; --muted: #9d92b2; --line: #2d2440;
    --accent: #a57ce0; --accent-ink: #110b1a; --done: #5cc58a; --na: #d8b65a; --na-bg: #2e2716; --hover: #221a31;
    --bar: #2a1650; --bar-ink: #ece5f8; --bar-muted: #b4a2d6; --bar-field: rgba(255,255,255,.08); --bar-line: rgba(255,255,255,.18); --bar-done: #5cc58a;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.35;
  margin: 0;
  padding-block: 0 calc(32px + env(safe-area-inset-bottom, 0px));
  font-size: 17px;
  -webkit-tap-highlight-color: transparent;
}
.wrap, .bar-in { max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { padding-block: 16px 0; }

header { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); }
.bar-in { padding-block: calc(12px + env(safe-area-inset-top, 0px)) 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.leg { display: flex; align-items: center; gap: 8px; }
.leg label { font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bar-muted); font-size: .95rem; }
.fltbox {
  display: flex; align-items: baseline; gap: .3em; padding: 2px 10px; border-radius: 8px;
  border: 1px solid var(--bar-line); background: var(--bar-field); cursor: text;
}
.fltbox span, .fltbox input { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .02em; text-transform: uppercase; color: var(--bar-ink); }
.fltbox input { width: 3.4em; padding: 0; border: 0; background: transparent; font-variant-numeric: tabular-nums; }
.fltbox input:focus { outline: none; }
.fltbox:focus-within { outline: 2px solid var(--bar-ink); outline-offset: 2px; }
.total { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.total .num { font-family: var(--display); font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.total .num.all { color: var(--bar-done); }
.fltbox input::placeholder { color: var(--bar-muted); }
.reset {
  font: 700 .95rem var(--body); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--bar-line);
  background: var(--bar-field); color: var(--bar-ink); cursor: pointer; min-height: 44px;
}
.mode { display: inline-flex; align-items: center; gap: 8px; }
.mode svg { width: 18px; height: 18px; }
.reset.arm { background: #b3261e; border-color: #b3261e; color: #fff; }

main { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 760px) { main { grid-template-columns: 1fr 1fr; } }

section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; overflow: hidden; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
h2 { font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .06em; text-transform: uppercase; margin: 0; }
.count { font-family: var(--display); font-weight: 600; font-size: 1.15rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.all { color: var(--done); }
.group-label { font-family: var(--display); font-weight: 600; font-size: .9rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 16px 4px; }

ul { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.sec-head { border-top: 4px solid var(--accent); }
.group-label + ul > .row:first-child, .sec-head + ul > .row:first-child { border-top: 0; }
.tick {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 58px;
  background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.tick:hover { background: var(--hover); }
.tick:focus-visible, .na:focus-visible, .reset:focus-visible, .expand:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
header .reset:focus-visible { outline-color: var(--bar-ink); outline-offset: 2px; }
.box {
  flex: none; width: 30px; height: 30px; border-radius: 7px; border: 2.5px solid var(--muted);
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.box svg { width: 20px; height: 20px; opacity: 0; }
.label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.name { font-weight: 700; }
.ref { font-size: .8rem; color: var(--muted); }
.row.on .box { background: var(--accent); border-color: var(--accent); }
.row.on .box svg { opacity: 1; }
.row.on .name { color: var(--muted); }
.row.isna .box { border-style: dashed; border-color: var(--na); }
.row.isna .name { color: var(--muted); text-decoration: line-through; }

.na {
  flex: none; align-self: center; margin-right: 12px; font: 700 .8rem var(--body); letter-spacing: .06em;
  padding: 8px 10px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer;
}
.row.isna .na { background: var(--na-bg); border-color: var(--na); color: var(--na); }
.expand {
  flex: none; align-self: center; margin-right: 12px; font: 700 .8rem var(--body); padding: 8px 10px; min-height: 40px;
  border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums;
}
.subs { background: var(--bg); border-top: 1px solid var(--line); }
.subs .row { border-top: 1px solid var(--line); }
.subs .row:first-child { border-top: 0; }
.subs .tick { min-height: 50px; padding-left: 36px; }
.subs .box { width: 24px; height: 24px; border-width: 2px; }
.subs .box svg { width: 16px; height: 16px; }
.subs .name { font-weight: 400; }
.times { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 0 16px 12px 74px; }
.times label { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.times input { width: 6.5em; font: inherit; font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; text-transform: uppercase; }
.times input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
footer { margin-top: 18px; font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .box { transition: none; } }
[hidden] { display: none !important; }
h1, h2, .count, .total .num { letter-spacing: .04em; }
</style>
</head>
<body>

<header>
  <div class="bar-in">
    <h1>777 Preflight</h1>
    <div class="leg">
      <label for="flt">Flight</label>
      <span class="fltbox"><span aria-hidden="true">FDX</span><input id="flt" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="____"></span>
    </div>
    <div class="total">
      <span class="num" id="totalNum">0/0</span>
      <button class="reset mode" id="mode" type="button"></button>
      <button class="reset" id="reset" type="button">Reset for next leg</button>
    </div>
  </div>
</header>

<div class="wrap">

  <main>
    <section aria-labelledby="hB">
      <div class="sec-head"><h2 id="hB">Briefings</h2><span class="count" id="cB"></span></div>
      <div id="briefings"></div>
    </section>
    <section aria-labelledby="hP">
      <div class="sec-head"><h2 id="hP">Required Paperwork</h2><span class="count" id="cP"></span></div>
      <div id="paperwork"></div>
    </section>
  </main>
  <footer>FOM Rev 83 · 777 FM Rev 18. Ticks and times are saved on this iPad and work offline. Mark an item N/A when it doesn't apply to this leg.</footer>
</div>

<script>
const BRIEFINGS = [
  { label: null, items: [
    { id: "crew", name: "Crew Briefing", ref: "FOM 3.06 · 13.03", subs: [
      ["c1", "Flight info: flight number, whose leg, ETOPS and/or redispatch"],
      ["c2", "Threats"],
      ["c10", "MTOB / aircraft T/O By time (more restrictive)", true],
      ["c11", "MEL/CDL items"],
      ["c3", "Deviations from FedEx standard procedures"],
      ["c4", "Emergency on takeoff"],
      ["c5", "HUD"],
      ["c6", "CRM briefing"],
      ["c7", "Security"],
      ["c8", "Special operations procedures for the leg"],
      ["c9", "Document security"]
    ]},
    { id: "perf", name: "Performance Briefing", ref: "FM p. 125 · before Before Start checklist" },
    { id: "dep", name: "Departure Briefing", ref: "FOM 4.33 · before engine start" }
  ]},
  { label: "If applicable", items: [
    { id: "jump", name: "Jumpseater Briefing", ref: "FOM 2.93 · O₂ demo before first leg", na: true },
    { id: "relief", name: "Relief Pilot Briefing", ref: "FOM 2.45 · duties, recall, rest", na: true },
    { id: "etops", name: "ETOPS Departure Items", ref: "FM p. 429 · LRN/ETOPS Guide duties", na: true },
    { id: "lives", name: "LIVES / Supernumerary Briefing", ref: "FOM 13.13", na: true }
  ]}
];
const PAPERWORK = [
  { label: null, items: [
    { id: "fpr", name: "FPR Signed", ref: "FOM 3.51 · release + weather" },
    { id: "emr", name: "eAML Flight Ready", ref: "FOM 3.51 · check T/O By time" },
    { id: "winds", name: "Winds" },
    { id: "gendec", name: "General Declarations", ref: "FOM 3.51", na: true },
    { id: "route", name: "Route Check", ref: "FM p. 131" },
    { id: "fuel", name: "Fuel Slip / eFuel Slip", ref: "FOM 3.51" },
    { id: "prelim", name: "Preliminary W&B", ref: "FOM 4.21" },
    { id: "final", name: "Final W&B", ref: "FOM 3.51 · 4.21" },
    { id: "dg", name: "Dangerous Goods", ref: "FOM 3.51" },
    { id: "pdc", name: "PDC" },
    { id: "lrn", name: "LRN", na: true }
  ]}
];

const KEY = "fdx777-preflight-v1";
let state = { t: {}, n: {}, open: {}, flt: "", mt: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = Object.assign(state, s); } catch (e) {}
if (!state.mt) state.mt = {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
// Ask iOS to keep this app's storage; a Home Screen app's storage is already exempt from Safari's 7-day cleanup.
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-ink)"/></svg>';

function isDone(item) {
  if (state.n[item.id]) return true;
  if (item.subs) return item.subs.every(([sid]) => state.t[sid]);
  return !!state.t[item.id];
}

function render(container, groups) {
  container.innerHTML = "";
  for (const g of groups) {
    if (g.label) { const d = document.createElement("div"); d.className = "group-label"; d.textContent = g.label; container.appendChild(d); }
    const ul = document.createElement("ul");
    for (const item of g.items) ul.appendChild(rowFor(item));
    container.appendChild(ul);
  }
}

function rowFor(item) {
  const li = document.createElement("li");
  const row = document.createElement("div");
  row.className = "row"; row.dataset.id = item.id;
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "tick"; btn.id = "t-" + item.id;
  btn.innerHTML = '<span class="box">' + CHECK + '</span><span class="label"><span class="name"></span>' + (item.ref ? '<span class="ref"></span>' : '') + '</span>';
  btn.querySelector(".name").textContent = item.name;
  if (item.ref) btn.querySelector(".ref").textContent = item.ref;
  btn.addEventListener("click", () => {
    if (state.n[item.id]) delete state.n[item.id];
    if (item.subs) {
      const target = !isDone(item);
      item.subs.forEach(([sid]) => { state.t[sid] = target; });
    } else {
      state.t[item.id] = !state.t[item.id];
    }
    save(); update();
  });
  row.appendChild(btn);
  if (item.subs) {
    const ex = document.createElement("button");
    ex.type = "button"; ex.className = "expand"; ex.id = "x-" + item.id;
    ex.addEventListener("click", () => { state.open[item.id] = !state.open[item.id]; save(); update(); });
    row.appendChild(ex);
  }
  if (item.na) {
    const na = document.createElement("button");
    na.type = "button"; na.className = "na"; na.id = "n-" + item.id; na.textContent = "N/A";
    na.addEventListener("click", () => {
      state.n[item.id] = !state.n[item.id];
      if (state.n[item.id]) state.t[item.id] = false;
      save(); update();
    });
    row.appendChild(na);
  }
  li.appendChild(row);
  if (item.subs) {
    const sub = document.createElement("ul");
    sub.className = "subs"; sub.id = "s-" + item.id;
    for (const [sid, sname, times] of item.subs) {
      const sli = document.createElement("li");
      const srow = document.createElement("div");
      srow.className = "row"; srow.dataset.id = sid;
      const sb = document.createElement("button");
      sb.type = "button"; sb.className = "tick"; sb.id = "t-" + sid;
      sb.innerHTML = '<span class="box">' + CHECK + '</span><span class="label"><span class="name"></span></span>';
      sb.querySelector(".name").textContent = sname;
      sb.addEventListener("click", () => { state.t[sid] = !state.t[sid]; save(); update(); });
      srow.appendChild(sb); sli.appendChild(srow);
      if (times) {
        const tw = document.createElement("div");
        tw.className = "times";
        for (const [k, lbl] of [["crew", "Crew MTOB"], ["ac", "Aircraft T/O By"]]) {
          const l = document.createElement("label");
          const inp = document.createElement("input");
          inp.id = "mt-" + k; inp.type = "text"; inp.inputMode = "numeric"; inp.autocomplete = "off"; inp.placeholder = "HHMMZ"; inp.maxLength = 6;
          inp.value = state.mt[k] || "";
          inp.addEventListener("input", () => { state.mt[k] = inp.value; save(); });
          l.htmlFor = inp.id; l.append(lbl, inp); tw.appendChild(l);
        }
        sli.appendChild(tw);
      }
      sub.appendChild(sli);
    }
    li.appendChild(sub);
  }
  return li;
}

function tally(groups) {
  let done = 0, total = 0;
  for (const g of groups) for (const item of g.items) { total++; if (isDone(item)) done++; }
  return [done, total];
}

function update() {
  for (const groups of [BRIEFINGS, PAPERWORK]) for (const g of groups) for (const item of g.items) {
    const row = document.querySelector('.row[data-id="' + item.id + '"]');
    const na = !!state.n[item.id];
    row.classList.toggle("isna", na);
    row.classList.toggle("on", !na && isDone(item));
    row.querySelector(".tick").setAttribute("aria-pressed", String(!na && isDone(item)));
    if (item.subs) {
      const n = item.subs.filter(([sid]) => state.t[sid]).length;
      const open = !!state.open[item.id];
      const ex = row.querySelector(".expand");
      ex.textContent = n + "/" + item.subs.length + (open ? " ▴" : " ▾");
      ex.setAttribute("aria-expanded", String(open));
      ex.setAttribute("aria-label", (open ? "Hide" : "Show") + " crew briefing items");
      document.getElementById("s-" + item.id).hidden = !open;
      for (const [sid] of item.subs) {
        const sr = document.querySelector('.row[data-id="' + sid + '"]');
        sr.classList.toggle("on", !!state.t[sid]);
        sr.querySelector(".tick").setAttribute("aria-pressed", String(!!state.t[sid]));
      }
    }
  }
  const [bd, bt] = tally(BRIEFINGS), [pd, pt] = tally(PAPERWORK);
  setCount("cB", bd, bt); setCount("cP", pd, pt); setCount("totalNum", bd + pd, bt + pt);
}
function setCount(id, d, t) { const el = document.getElementById(id); el.textContent = d + "/" + t; el.classList.toggle("all", d === t); }

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const modeBtn = document.getElementById("mode");
const sysDark = window.matchMedia("(prefers-color-scheme: dark)");
function isNight() { return state.theme ? state.theme === "dark" : sysDark.matches; }
function applyTheme() {
  if (state.theme) document.documentElement.dataset.theme = state.theme; else delete document.documentElement.dataset.theme;
  const night = isNight();
  modeBtn.innerHTML = (night ? SUN : MOON) + "<span>" + (night ? "Day" : "Night") + "</span>";
  modeBtn.setAttribute("aria-label", night ? "Switch to day mode" : "Switch to night mode");
  document.querySelector('meta[name="theme-color"]').setAttribute("content", night ? "#2a1650" : "#4d148c");
}
modeBtn.addEventListener("click", () => { state.theme = isNight() ? "light" : "dark"; save(); applyTheme(); });
sysDark.addEventListener && sysDark.addEventListener("change", applyTheme);
applyTheme();

render(document.getElementById("briefings"), BRIEFINGS);
render(document.getElementById("paperwork"), PAPERWORK);
const flt = document.getElementById("flt");
state.flt = (state.flt || "").replace(/^\s*FDX\s*/i, "");
flt.value = state.flt;
flt.addEventListener("input", () => { state.flt = flt.value; save(); });
document.querySelector(".fltbox").addEventListener("click", () => flt.focus());

const reset = document.getElementById("reset");
let armTimer = null;
reset.addEventListener("click", () => {
  if (!reset.classList.contains("arm")) {
    reset.classList.add("arm"); reset.textContent = "Tap again to clear";
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  clearTimeout(armTimer);
  state = { t: {}, n: {}, open: state.open, flt: "", mt: {}, theme: state.theme };
  flt.value = ""; document.querySelectorAll(".times input").forEach(i => { i.value = ""; }); save(); update(); disarm();
});
function disarm() { reset.classList.remove("arm"); reset.textContent = "Reset for next leg"; }

update();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
